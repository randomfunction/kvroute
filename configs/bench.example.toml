# Example bench configuration (reference only).
#
# Phase-1 `kvroute bench` takes its settings from CLI flags; this file documents
# the knobs and the values the flags map to, and is the shape the TOML loader
# (serde + toml, phase 2) will read. See `kvroute bench --help`.

[fleet]
replicas = 4
block_size = 16                 # must match each replica's --block-size
cache_capacity_blocks = 20000   # resident blocks per replica before LRU eviction

[cost_model]
prefill_ns_per_token = 2000     # server-busy time per uncached prompt token
decode_ns_per_token  = 5000000  # added to latency; overlaps (does not block the server)

[trace]
seed = 1
sessions = 1500
system_prompts = 40             # distinct shared system prompts
prompt_skew = 1.1               # Zipf skew (higher = a few prompts dominate)
tenants = 16
tenant_skew = 1.3
isolate_tenants = false         # true ⇒ per-tenant cache salt (isolation)
turns = [1, 6]                  # turns per session (inclusive range)
output_tokens_mean = 256
session_gap_ns = 8000000        # mean gap between session starts (Poisson)
burstiness = 0.15               # chance a session clusters onto the previous start
think_ns = 2000000000           # mean think-time between a session's turns
tool_pause_prob = 0.25          # chance a between-turn gap is a long tool-call pause
tool_pause_mult = 6.0

[policy.score]
lambda = 200.0                  # load weight λ in: score = tokens_saved − λ·load
